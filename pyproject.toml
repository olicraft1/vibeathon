[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charlaviva"
version = "0.1.0"
description = "CharlaViva — open source live captions & simultaneous translation for conferences"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "CharlaViva contributors" }]
keywords = ["captions", "subtitles", "live", "conferences", "accessibility", "gemini", "whisper"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-genai>=1.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "av>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
charlaviva = "charlaviva.cli:main"

[tool.setuptools.packages.find]
include = ["charlaviva*"]
